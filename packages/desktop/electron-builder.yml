# How the desktop app is packaged. From the repository root:
#
#   npm run app:dist       build the Mac disk images into packages/desktop/release/
#   npm run app:release    build them and publish a release to costgrid-releases (needs GH_TOKEN)
#
# Without an Apple Developer ID the app is ad-hoc signed (build/after-pack.cjs)
# and macOS asks the person to confirm the first time they open it. Signing and
# notarization with a Developer ID add three environment variables on the Mac
# that builds it (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) plus
# `notarize: true` under mac below.
appId: dev.costgrid.desktop
productName: CostGrid
copyright: Copyright © 2026 Tomas Buica
# A fixed file name, so the website can always link to the newest release.
artifactName: "CostGrid-${arch}.${ext}"
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
# The SQLite binding is native code and has to sit outside the archive to load.
# It is built on Node-API with a prebuilt binary for every platform, so nothing
# is compiled at packaging time and no compiler is needed on the build machine.
asarUnpack:
  - "**/*.node"
npmRebuild: false
afterPack: build/after-pack.cjs
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  target: nsis
linux:
  target: AppImage
  category: Utility
publish:
  provider: github
  owner: tbuica-droid
  repo: costgrid-releases
  releaseType: release
