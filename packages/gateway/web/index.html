<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CostGrid</title>
<link rel="stylesheet" href="/app/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230f1411'/><rect x='3' y='9' width='2' height='4' fill='%239d7b1f'/><rect x='7' y='5' width='2' height='8' fill='%23f5f2e9'/><rect x='11' y='7' width='2' height='6' fill='%23a8452a'/></svg>" />
</head>
<body>

<header>
  <span class="brand">CostGrid</span>
  <span class="tagline">Agentic FinOps &amp; AI governance</span>
  <nav id="nav">
    <button data-view="overview" aria-current="true">Overview</button>
    <button data-view="agents">Agents</button>
    <button data-view="routing">Routing</button>
    <button data-view="policies">Policies</button>
    <button data-view="pricing">Pricing</button>
  </nav>
  <select id="range" aria-label="Time range">
    <option value="1">24 hours</option>
    <option value="7">7 days</option>
    <option value="30" selected>30 days</option>
    <option value="90">90 days</option>
  </select>
</header>

<main id="main">
  <p class="rail">Loading…</p>
</main>

<footer>
  <span>CostGrid — metering live traffic through this gateway</span>
  <span id="footer-note"></span>
</footer>

<script type="module" src="/app/app.js"></script>
</body>
</html>
