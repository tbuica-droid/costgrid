name: Security

on:
  push:
  pull_request:
  schedule:
    # Weekly, so an advisory published against an unchanged lockfile is still seen.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Reads package-lock.json only; nothing is installed or run.
      - name: Audit dependencies
        run: npm audit --audit-level=high
